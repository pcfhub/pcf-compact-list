<svg width="96" height="96" viewBox="0 0 96 96" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Three records, stacked, and nothing around them.

       Every other dataset control here draws a card and puts something inside
       it. This one is for narrow spaces, so the mark has no container at all:
       the rows are the silhouette. That is also the difference between it and
       pcf-data-table, which is the same records inside a frame with a header.

       The ramp is the PCFHub mark's own, verbatim, so this sits in the family rather
       than beside it. Declared in userSpaceOnUse and spanning the whole 96
       canvas, so the mark reads as one object lit from the top right.

       Drawn for 32px. The rows are 20 tall with 6 of gap, which is a wider gap
       than the composition wants at 80 and the only ratio that still shows
       three separate rows rather than one striped block at 24.

       Note: no double hyphen may appear in this comment, or the whole document
       fails to parse as XML. -->
  <defs>
    <linearGradient id="compact-list-ramp" x1="8" y1="80" x2="88" y2="16" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A684FF"/><stop offset="0.6" stop-color="#7C86FF"/><stop offset="1" stop-color="#00BCFF"/>
    </linearGradient>
  </defs>
  <!-- The records. -->
  <rect x="8" y="12" width="80" height="20" rx="10" fill="url(#compact-list-ramp)"/>
  <rect x="8" y="38" width="80" height="20" rx="10" fill="url(#compact-list-ramp)"/>
  <rect x="8" y="64" width="80" height="20" rx="10" fill="url(#compact-list-ramp)"/>

  <!-- The primary column on each. Left aligned and short, so the rows read as
       records rather than as a paragraph. -->
  <rect x="19" y="19" width="30" height="6" rx="3" fill="#F8FAFC"/>
  <rect x="19" y="45" width="30" height="6" rx="3" fill="#F8FAFC"/>
  <rect x="19" y="71" width="30" height="6" rx="3" fill="#F8FAFC"/>
</svg>
